name: publish
# Publishes tergite-chipcal to PyPI by trusted publishing (OIDC, no API token) when a tag vX.Y.Z is pushed that
# matches the version in pyproject.toml. PyPI side: a (pending) trusted publisher for owner tergite, repository
# tergite-chipcal, workflow publish.yml, environment pypi.
on:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Tag matches the package version
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "${GITHUB_REF_NAME#v}" = "$version" || { echo "tag $GITHUB_REF_NAME != version $version"; exit 1; }
      - run: pip install -e ".[test]" build twine
      - run: OMP_NUM_THREADS=1 pytest -q -m "not slow"
      - run: python -m chipcal.splits verify data/v0.1
      - run: python -m build && twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/tergite-chipcal
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
