name: CI
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      job:
        description: "release: build and publish the current commit"
        required: false
        default: ""

# Publishing switches, as repository variables in the other Tergite repos. Production uses trusted publishing, not
# the organisation's PYPI_API_TOKEN, so releases keep their provenance.
env:
  SHOULD_PUBLISH_TO_PROD: "true"
  SHOULD_PUBLISH_TO_STAGING: "false"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]"
      - run: OMP_NUM_THREADS=1 pytest -q -m "not slow"
      - run: python -m chipcal.splits verify data/v0.1

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # The open-source gitleaks CLI, pinned by checksum; gitleaks-action needs a paid licence for organisation repos.
      - name: gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --verbose .

  release:
    name: Release
    runs-on: ubuntu-latest
    if: |
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'release')
    needs: tests
    # Trusted publishing (OIDC): PyPI's trusted publisher for tergite/tergite-chipcal names this workflow, ci.yml.
    # It needs no token and attaches provenance attestations; a token upload has none and PyPI flags the loss.
    environment:
      name: pypi
      url: https://pypi.org/p/tergite-chipcal
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout the commit
        uses: actions/checkout@v5
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          cd $GITHUB_WORKSPACE
          python -m pip install --upgrade pip
          python --version
          pip install .
          pip install build twine
      - name: Tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "${GITHUB_REF_NAME#v}" = "$version" || { echo "tag $GITHUB_REF_NAME != version $version"; exit 1; }
      - name: Build
        run: python -m build && twine check dist/*
      - name: Publish to Test pypi
        if: ${{ env.SHOULD_PUBLISH_TO_STAGING == 'true' }}
        run: |
          twine upload --skip-existing \
            -u __token__ \
            -p ${{ secrets.TEST_PYPI_API_TOKEN }} \
            -r https://test.pypi.org/legacy/ dist/*;
      - name: Publish to pypi
        if: ${{ env.SHOULD_PUBLISH_TO_PROD == 'true' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
