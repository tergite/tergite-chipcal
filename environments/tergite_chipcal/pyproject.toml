[project]
name = "tergite-chipcal"
version = "0.1.0"
description = "Calibrate a simulated superconducting-qubit chip: discovery, then CZ gates on every coupler"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["verifiers>=0.4.0", "tergite-chipcal"]
tags = ["multi-turn", "vision", "physics", "quantum", "calibration", "agentic"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["tergite_chipcal.py", "pyproject.toml", "README.md"]
